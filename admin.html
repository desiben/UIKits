<!doctype html>
<html lang="en" data-theme="light" data-brand="iris">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Licenses · ETKits admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://facetui.vercel.app/assets/tokens.css">
  <link rel="stylesheet" href="https://facetui.vercel.app/assets/facet.css">
  <script src="https://facetui.vercel.app/assets/icons.js"></script>
  <script src="https://facetui.vercel.app/assets/facet.js"></script>
  <style>
    body { background: var(--bg-canvas); min-height: 100vh; }
    .wrap { width: min(1180px, 100% - 32px); margin: 0 auto; padding: 32px 0 64px; }
    .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
    .top h1 { font: var(--text-heading-h3); margin: 0; }
    .top .grow { flex: 1; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .tools .input-group { flex: 1 1 260px; max-width: 380px; }
    .login { width: min(420px, 100% - 32px); margin: 12vh auto 0; }
    .dev-bar { display: flex; align-items: center; gap: 8px; min-width: 120px; }
    .dev-bar .progress { flex: 1; }
    .muted { color: var(--text-tertiary); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
    .table td { vertical-align: middle; }
    .sheet { width: min(520px, 100%); overflow: auto; }
    .kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; font: var(--text-body-sm); }
    .kv dt { color: var(--text-tertiary); } .kv dd { margin: 0; overflow-wrap: anywhere; }
    .dev { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle); }
    .dev .grow { min-width: 0; } .dev small { display: block; color: var(--text-tertiary); }
    .ev { display: flex; gap: 10px; font: var(--text-body-xs); padding: 6px 0; border-bottom: 1px solid var(--border-subtle); }
    .ev time { color: var(--text-tertiary); width: 128px; flex: none; }
    .section-title { font: var(--text-label-md); margin: 20px 0 6px; }
    .empty-row td { text-align: center; padding: 48px 0; color: var(--text-tertiary); }
    @media (max-width: 640px) { .hide-sm { display: none; } .kv { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var ic = function (n, c) { return '<svg class="icon' + (c ? " " + c : "") + '" aria-hidden="true"><use href="#' + n + '"/></svg>'; };
  var ago = function (iso) { if (!iso) return "never"; var s = (Date.now() - Date.parse(iso)) / 1000; if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago"; if (s < 86400) return Math.floor(s / 3600) + " h ago"; if (s < 86400 * 30) return Math.floor(s / 86400) + " d ago"; return new Date(iso).toLocaleDateString(); };
  var date = function (iso) { return iso ? new Date(iso).toLocaleString() : "—"; };
  var PASS = "etkits-admin";
  var state = { list: [], products: [], q: "", filter: "all", product: "", open: null };
  var pass = function () { try { return sessionStorage.getItem(PASS) || ""; } catch (e) { return ""; } };

  function api(method, body) {
    return fetch("/api/admin", { method: method, headers: Object.assign({ Authorization: "Bearer " + pass() }, body ? { "content-type": "application/json" } : {}), body: body ? JSON.stringify(body) : undefined, cache: "no-store" })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) { var e = new Error(d.error || "Request failed (" + r.status + ")"); e.status = r.status; throw e; } return d; }); });
  }
  function toast(t, tone) { if (window.Facet && Facet.toast) Facet.toast(Object.assign({ title: t, timeout: 2200 }, tone ? { tone: "var(--icon-danger)", icon: "alert-circle" } : {})); }

  /* ---------- login ---------- */
  function login(msg) {
    $("#app").innerHTML = '<form class="card login" id="login"><div class="card-header"><div class="grow"><div class="card-title">ETKits licenses</div><div class="card-desc">Admin only. Use the password set as ETKITS_ADMIN_PASSWORD on the et-uikits Vercel project.</div></div></div>' +
      '<div class="card-body"><div class="field' + (msg ? '" data-invalid="true' : "") + '"><label class="label" for="pw">Password</label><input class="input" id="pw" type="password" autocomplete="current-password" required' + (msg ? ' aria-invalid="true"' : "") + '><span class="help">' + esc(msg || "") + "</span></div></div>" +
      '<div class="card-footer"><button class="btn" type="submit">' + ic("lock", "icon-sm") + " Sign in</button></div></form>";
    $("#pw").focus();
    $("#login").addEventListener("submit", function (e) { e.preventDefault(); try { sessionStorage.setItem(PASS, $("#pw").value); } catch (err) {} load(); });
  }
  function load() {
    api("GET").then(function (d) { state.list = d.licenses; state.products = d.products; render(); })
      .catch(function (e) { if (e.status === 401 || e.status === 503) { try { sessionStorage.removeItem(PASS); } catch (err) {} login(e.message); } else toast(e.message, true); });
  }

  /* ---------- list ---------- */
  var prod = function (slug) { return state.products.find(function (p) { return p.slug === slug; }) || { slug: slug, name: slug, deviceLimit: 5, claimLimit: 3 }; };
  var pname = function (l) { return l.products.map(function (s) { return prod(s).name; }).join(", ") || "—"; };
  var limitOf = function (l, slug) { return l.limit || prod(slug || l.products[0]).deviceLimit; };
  var devsOf = function (l, slug) { return l.devices.filter(function (d) { return !slug || d.product === slug; }); };
  var claimLimitOf = function (l) { return l.claimLimit || prod(l.products[0]).claimLimit; };
  var atLimit = function (l) { return l.products.some(function (s) { return devsOf(l, s).length >= limitOf(l, s); }); };
  var status = function (l) {
    if (l.revoked) return '<span class="badge badge-danger">Revoked</span>';
    if (!l.storeOk) return '<span class="badge badge-warning">' + esc(l.storeReason || "Not valid") + "</span>";
    if (atLimit(l)) return '<span class="badge badge-warning">At limit</span>';
    return '<span class="badge badge-success"><span class="dot"></span>Active</span>';
  };
  function visible() {
    var q = state.q.toLowerCase();
    return state.list.filter(function (l) {
      if (state.product && l.products.indexOf(state.product) < 0) return false;
      if (state.filter === "active" && (l.revoked || !l.storeOk)) return false;
      if (state.filter === "revoked" && !l.revoked) return false;
      if (state.filter === "limit" && !atLimit(l)) return false;
      return !q || [l.email, l.keyMasked, l.note, l.store, pname(l)].concat(l.devices.map(function (d) { return d.name; })).join(" ").toLowerCase().indexOf(q) >= 0;
    });
  }
  function render() {
    var L = state.list, devs = L.reduce(function (a, l) { return a + l.devices.length; }, 0);
    var kpi = function (label, value) { return '<div class="card kpi"><span class="kpi-label">' + label + '</span><span class="kpi-value">' + value + "</span></div>"; };
    var rows = visible().map(function (l) {
      var lim = limitOf(l), pct = Math.min(100, Math.round(l.devices.length / lim * 100));
      return '<tr><td><b>' + esc(l.email || "—") + '</b><div class="t-caption muted">' + esc(l.store === "manual" ? "Added by you" : l.store === "envato" ? "Envato" : "Gumroad") + (l.note ? " · " + esc(l.note.slice(0, 40)) : "") + "</div></td>" +
        "<td>" + esc(pname(l)) + "</td>" +
        '<td class="mono hide-sm">' + esc(l.keyMasked) + "</td>" +
        '<td><div class="dev-bar"><div class="progress progress-sm"><span style="--value:' + pct + '%"></span></div><span class="t-caption">' + l.devices.length + " / " + lim + "</span></div></td>" +
        '<td class="hide-sm">' + l.claims + " / " + claimLimitOf(l) + '</td><td class="hide-sm">' + ago(l.lastSeen) + "</td><td>" + status(l) + '</td><td><button class="btn btn-outline btn-sm" data-manage="' + l.id + '">Manage</button></td></tr>';
    }).join("");
    $("#app").innerHTML = '<div class="wrap"><div class="top"><h1>Licenses</h1><span class="grow"></span>' +
      '<button class="btn btn-ghost btn-sm" data-act="refresh">' + ic("refresh-cw", "icon-sm") + ' Refresh</button><button class="btn btn-sm" data-act="add">' + ic("plus", "icon-sm") + ' Add key</button><button class="btn btn-ghost btn-sm" data-act="signout">Sign out</button></div>' +
      '<div class="stats">' + kpi("Licenses", L.length) + kpi("Active", L.filter(function (l) { return !l.revoked && l.storeOk; }).length) + kpi("Revoked", L.filter(function (l) { return l.revoked; }).length) + kpi("Devices in use", devs) + kpi("Figma claims", L.reduce(function (a, l) { return a + (l.claims || 0); }, 0)) + "</div>" +
      '<div class="tools"><div class="input-group">' + ic("search") + '<input class="input" id="q" placeholder="Search email, key, device or note" value="' + esc(state.q) + '"></div>' +
      '<div class="tabs-pill" role="tablist">' + [["all", "All"], ["active", "Active"], ["limit", "At limit"], ["revoked", "Revoked"]].map(function (f) { return '<button class="tab" role="tab" aria-selected="' + (state.filter === f[0]) + '" data-filter="' + f[0] + '">' + f[1] + "</button>"; }).join("") + "</div>" +
      '<select class="select" id="prod" style="width:auto" aria-label="Product"><option value="">All products</option>' + state.products.map(function (p) { return '<option value="' + p.slug + '"' + (state.product === p.slug ? " selected" : "") + ">" + esc(p.name) + "</option>"; }).join("") + "</select></div>" +
      '<div class="table-wrap"><table class="table"><thead><tr><th>Buyer</th><th>Product</th><th class="hide-sm">Key</th><th>Devices</th><th class="hide-sm">Figma claims</th><th class="hide-sm">Last used</th><th>Status</th><th></th></tr></thead><tbody>' +
      (rows || '<tr class="empty-row"><td colspan="8">' + (L.length ? "No licenses match." : "No licenses yet. A key appears here the first time a buyer claims the Figma file, unlocks a style guide or installs with a CLI.") + "</td></tr>") +
      "</tbody></table></div></div>";
    $("#prod").addEventListener("change", function (e) { state.product = e.target.value; render(); });
    var q = $("#q"); q.addEventListener("input", function () { state.q = q.value; var pos = q.selectionStart; render(); var n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); });
    if (state.open) manage(state.open);
  }

  /* ---------- one license ---------- */
  function manage(id) {
    var l = state.list.find(function (x) { return x.id === id; }); if (!l) return;
    state.open = id;
    var old = $("#sheet"); if (old) old.remove();
    var dev = l.devices.map(function (d) {
      return '<div class="dev">' + ic(d.kind === "cli" ? "square-terminal" : "monitor") + '<div class="grow"><b class="t-label-sm">' + esc(d.name || (d.kind === "cli" ? "CLI" : "Browser")) + "</b><small>" + esc(prod(d.product).name) + " · " + (d.kind === "cli" ? "CLI" : "Style guide") + " · first " + ago(d.firstSeen) + " · last " + ago(d.lastSeen) + " · " + (d.uses || 1) + ((d.uses || 1) === 1 ? " use" : " uses") + '</small></div><button class="btn btn-ghost btn-sm" data-rm="' + esc(d.id) + '">Remove</button></div>';
    }).join("") || '<p class="t-body-sm muted">No devices yet.</p>';
    var ev = l.events.map(function (e) { return '<div class="ev"><time>' + date(e.t) + "</time><span>" + esc(e.kind) + (e.note ? " · " + esc(e.note) : "") + (e.ok ? "" : ' · <b class="text-danger">refused</b>') + "</span></div>"; }).join("") || '<p class="t-body-sm muted">No activity yet.</p>';
    var el = document.createElement("div");
    el.className = "overlay sheet-overlay"; el.id = "sheet";
    el.innerHTML = '<aside class="sheet" role="dialog" aria-modal="true" aria-label="License"><div class="dialog-header row" style="justify-content:space-between"><div><div class="dialog-title">' + esc(l.email || "License") + '</div><div class="dialog-desc">' + status(l) + '</div></div><button class="btn btn-ghost btn-sm icon-btn" data-close-sheet aria-label="Close">' + ic("x") + "</button></div>" +
      '<div class="dialog-body"><dl class="kv"><dt>Key</dt><dd class="mono">' + esc(l.keyMasked) + "</dd><dt>Products</dt><dd>" + esc(pname(l)) + "</dd><dt>Store</dt><dd>" + esc(l.store) + (l.variant ? " · " + esc(l.variant) : "") + "</dd><dt>Figma claims</dt><dd>" + l.claims + " of " + claimLimitOf(l) + "</dd><dt>Purchased</dt><dd>" + date(l.purchasedAt) + "</dd><dt>First used</dt><dd>" + date(l.firstSeen) + "</dd><dt>Last used</dt><dd>" + date(l.lastSeen) + "</dd>" + (l.revoked ? "<dt>Revoked</dt><dd>" + date(l.revokedAt) + (l.revokedReason ? " · " + esc(l.revokedReason) : "") + "</dd>" : "") + "</dl>" +
      '<div class="section-title">Device limit</div><div class="row" style="--gap:8px"><input class="input" id="lim" type="number" min="1" max="1000" style="width:120px" placeholder="' + prod(l.products[0]).deviceLimit + ' (default)" value="' + (l.limit || "") + '"><button class="btn btn-outline btn-sm" data-act="limit">Save limit</button></div>' +
      '<div class="section-title">Figma claim limit</div><div class="row" style="--gap:8px"><input class="input" id="climit" type="number" min="1" max="1000" style="width:120px" placeholder="' + prod(l.products[0]).claimLimit + ' (default)" value="' + (l.claimLimit || "") + '"><button class="btn btn-outline btn-sm" data-act="climit">Save</button>' + (l.claims ? '<button class="btn btn-ghost btn-sm" data-act="rclaims">Reset claims</button>' : "") + "</div>" +
      '<div class="section-title">Devices · ' + l.devices.length + (l.products.length === 1 ? " of " + limitOf(l) : "") + "</div>" + dev + (l.devices.length ? '<button class="btn btn-ghost btn-sm" data-act="reset" style="margin-top:8px">Remove all devices</button>' : "") +
      '<div class="section-title">Note</div><textarea class="textarea" id="note" rows="2" placeholder="Private note (team size, support ticket…)">' + esc(l.note) + '</textarea><div><button class="btn btn-outline btn-sm" data-act="note" style="margin-top:8px">Save note</button></div>' +
      '<div class="section-title">Recent activity</div>' + ev + "</div>" +
      '<div class="dialog-footer">' + (l.revoked ? '<button class="btn" data-act="restore">' + ic("rotate-ccw", "icon-sm") + " Restore license</button>" : '<button class="btn btn-destructive" data-act="revoke">' + ic("circle-x", "icon-sm") + " Revoke license</button>") + "</div></aside>";
    document.body.appendChild(el);
  }
  function act(body, done) {
    api("POST", body).then(function (d) {
      if (d.license) state.list = state.list.map(function (x) { return x.id === d.license.id ? d.license : x; }).concat(state.list.some(function (x) { return x.id === d.license.id; }) ? [] : [d.license]);
      render(); if (done) done(d);
    }).catch(function (e) { toast(e.message, true); });
  }
  function addDialog() {
    var el = document.createElement("div"); el.className = "overlay"; el.id = "addkey";
    el.innerHTML = '<form class="dialog" role="dialog" aria-modal="true" aria-label="Add a key"><div class="dialog-header"><div class="dialog-title">Add a key</div><div class="dialog-desc">For press, testers or a sale made outside the stores. Leave the key empty to generate one.</div></div>' +
      '<div class="dialog-body"><div class="field"><label class="label" for="ak-email">Email</label><input class="input" id="ak-email" type="email" placeholder="name@company.com"></div><div class="field"><span class="label">Products</span>' + state.products.map(function (p, k) { return '<label class="check"><input type="checkbox" name="ak-prod" value="' + p.slug + '"' + (k ? "" : " checked") + "><span>" + esc(p.name) + "</span></label>"; }).join("") + '</div><div class="field"><label class="label" for="ak-key">Key (optional)</label><input class="input mono" id="ak-key" placeholder="Generated if empty"></div><div class="field"><label class="label" for="ak-note">Note</label><input class="input" id="ak-note" placeholder="e.g. Review copy for Design Weekly"></div><div id="ak-out"></div></div>' +
      '<div class="dialog-footer"><button type="button" class="btn btn-ghost" data-close-add>Close</button><button class="btn" type="submit">Add key</button></div></form>';
    document.body.appendChild(el); $("#ak-email").focus();
    el.querySelector("form").addEventListener("submit", function (e) {
      e.preventDefault();
      act({ action: "add", products: Array.prototype.map.call(document.querySelectorAll("[name=ak-prod]:checked"), function (x) { return x.value; }), email: $("#ak-email").value, key: $("#ak-key").value, note: $("#ak-note").value }, function (d) {
        $("#ak-out").innerHTML = '<div class="alert alert-success" role="status">' + ic("check-circle-2") + '<div><div class="alert-title">Key added. Copy it now, it is only shown once:</div><div class="alert-desc mono" style="user-select:all">' + esc(d.key) + '</div></div></div>';
        el.querySelector("[type=submit]").disabled = true;
      });
    });
  }

  document.addEventListener("click", function (e) {
    var t = e.target;
    var m = t.closest("[data-manage]"); if (m) return manage(m.dataset.manage);
    var f = t.closest("[data-filter]"); if (f) { state.filter = f.dataset.filter; return render(); }
    if (t.closest("[data-close-sheet]") || t.id === "sheet") { state.open = null; var s = $("#sheet"); if (s) s.remove(); return; }
    if (t.closest("[data-close-add]") || t.id === "addkey") { var a = $("#addkey"); if (a) a.remove(); return; }
    var rm = t.closest("[data-rm]"); if (rm) return act({ action: "removeDevice", id: state.open, device: rm.dataset.rm });
    var b = t.closest("[data-act]"); if (!b) return;
    var k = b.dataset.act, id = state.open;
    if (k === "refresh") load();
    else if (k === "add") addDialog();
    else if (k === "signout") { try { sessionStorage.removeItem(PASS); } catch (err) {} login(); }
    else if (k === "limit") act({ action: "limit", id: id, limit: $("#lim").value }, function () { toast("Limit saved"); });
    else if (k === "climit") act({ action: "claimLimit", id: id, limit: $("#climit").value }, function () { toast("Claim limit saved"); });
    else if (k === "rclaims") { if (confirm("Reset this key's Figma claims to 0?")) act({ action: "resetClaims", id: id }); }
    else if (k === "note") act({ action: "note", id: id, note: $("#note").value }, function () { toast("Note saved"); });
    else if (k === "reset") { if (confirm("Remove every device from this license? The buyer's browsers and machines will have to unlock again.")) act({ action: "resetDevices", id: id }); }
    else if (k === "revoke") { var r = prompt("Revoke this license? It stops working everywhere within a minute.\n\nReason (optional, private):", ""); if (r !== null) act({ action: "revoke", id: id, reason: r }, function () { toast("License revoked"); }); }
    else if (k === "restore") act({ action: "restore", id: id }, function () { toast("License restored"); });
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { var s = $("#sheet"), a = $("#addkey"); if (a) a.remove(); else if (s) { s.remove(); state.open = null; } } });

  pass() ? load() : login();
})();
</script>
</body>
</html>
